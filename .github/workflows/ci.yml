name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: macos-26
    env:
      TMPDIR: ${{ github.workspace }}/tmp/ci
      TMP: ${{ github.workspace }}/tmp/ci
      TEMP: ${{ github.workspace }}/tmp/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create temp dir
        run: mkdir -p "$TMPDIR"

      - name: Show Swift version
        run: swift --version

      - name: Verify hardcoded system command paths exist
        run: |
          for p in \
            /bin/sh /bin/launchctl /bin/mkdir /bin/cp /bin/mv /bin/rm /bin/chmod \
            /usr/bin/printf /usr/bin/xattr /usr/sbin/chown /usr/bin/pmset /usr/bin/plutil
          do
            test -x "$p" || { echo "MISSING $p"; exit 1; }
          done

      - name: Build
        run: swift build -c debug --scratch-path tmp/.build

      - name: Test
        run: swift test --scratch-path tmp/.build

      - name: Package (ad-hoc signed .app.zip)
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package.sh

      - name: Verify app bundle and version metadata
        run: |
          APP="tmp/build/TriCup.app"
          for f in \
            "Contents/MacOS/TriCup" \
            "Contents/MacOS/TriCupHelper" \
            "Contents/Info.plist" \
            "Contents/Resources/empty.png" \
            "Contents/Resources/half.png" \
            "Contents/Resources/full.png" \
            "Contents/Resources/AppIcon.icns"
          do
            test -e "$APP/$f" || { echo "MISSING $f"; exit 1; }
          done
          if [ -e "$APP/Contents/Resources/TriCup_TriCup.bundle" ] || [ -e "$APP/TriCup_TriCup.bundle" ]; then
            echo "unexpected SwiftPM resource bundle present"; exit 1
          fi
          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          VER=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")
          echo "CFBundleShortVersionString=$VER"
          echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || { echo "invalid version string"; exit 1; }
          codesign --verify --strict "$APP"

      - name: Smoke test from isolated path
        run: |
          ISOLATED="$RUNNER_TEMP/tricup-smoke"
          rm -rf "$ISOLATED"
          mkdir -p "$ISOLATED"
          cp -R "tmp/build/TriCup.app" "$ISOLATED/"
          "$ISOLATED/TriCup.app/Contents/MacOS/TriCup" --self-test

      - name: Upload TriCup.app.zip
        uses: actions/upload-artifact@v4
        with:
          name: TriCup-app
          path: tmp/build/TriCup.app.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TriCup-app
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TriCup.app.zip \
            --title "TriCup $GITHUB_REF_NAME" \
            --notes "TriCup $GITHUB_REF_NAME (arm64, ad-hoc signed)." \
            --verify-tag --repo "$GITHUB_REPOSITORY"
