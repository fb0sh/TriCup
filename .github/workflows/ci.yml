name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 1.0.0). Publishes to tag v<version>."
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    strategy:
      # Never cancel the other architecture: each job publishes its own DMG as
      # soon as it is ready, without waiting for the rest of the matrix.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            run_tests: true
          - arch: x64
            runner: macos-26-intel
            run_tests: false
    runs-on: ${{ matrix.runner }}
    # Needed only for the release-publishing step below; guarded by `if`.
    permissions:
      contents: write
    env:
      TMPDIR: ${{ github.workspace }}/tmp/ci
      TMP: ${{ github.workspace }}/tmp/ci
      TEMP: ${{ github.workspace }}/tmp/ci
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For a manual run, check out the exact release tag so the published
          # DMG matches that version. Otherwise use the default checkout ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || '' }}

      - name: Create temp dir
        run: mkdir -p "$TMPDIR"

      - name: Show Swift version
        run: swift --version

      - name: Verify hardcoded system command paths exist
        run: |
          for p in \
            /bin/sh /bin/launchctl /bin/mkdir /bin/cp /bin/mv /bin/rm /bin/chmod \
            /usr/bin/printf /usr/bin/xattr /usr/sbin/chown /usr/bin/pmset /usr/bin/plutil
          do
            test -x "$p" || { echo "MISSING $p"; exit 1; }
          done

      - name: Build and test (arm64 only)
        if: matrix.run_tests
        run: |
          swift build -c debug --scratch-path tmp/.build
          swift test --scratch-path tmp/.build

      - name: Package ${{ matrix.arch }} DMG (ad-hoc signed)
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package.sh

      - name: Verify app bundle and version metadata
        run: |
          APP="tmp/build/TriCup.app"
          for f in \
            "Contents/MacOS/TriCup" \
            "Contents/MacOS/TriCupHelper" \
            "Contents/Info.plist" \
            "Contents/Resources/empty.png" \
            "Contents/Resources/half.png" \
            "Contents/Resources/full.png" \
            "Contents/Resources/AppIcon.icns"
          do
            test -e "$APP/$f" || { echo "MISSING $f"; exit 1; }
          done
          if [ -e "$APP/Contents/Resources/TriCup_TriCup.bundle" ] || [ -e "$APP/TriCup_TriCup.bundle" ]; then
            echo "unexpected SwiftPM resource bundle present"; exit 1
          fi
          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          VER=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")
          echo "CFBundleShortVersionString=$VER"
          echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$' || { echo "invalid version string"; exit 1; }
          codesign --verify --strict "$APP"

      - name: Smoke test from isolated path
        run: |
          ISOLATED="$RUNNER_TEMP/tricup-smoke"
          rm -rf "$ISOLATED"
          mkdir -p "$ISOLATED"
          cp -R "tmp/build/TriCup.app" "$ISOLATED/"
          "$ISOLATED/TriCup.app/Contents/MacOS/TriCup" --self-test

      - name: Upload ${{ matrix.arch }} DMG
        uses: actions/upload-artifact@v4
        with:
          name: TriCup-${{ matrix.arch }}-dmg
          path: tmp/build/TriCup-${{ matrix.arch }}.dmg
          if-no-files-found: error

      # Publish this architecture's DMG to the release the moment its own build
      # succeeds, instead of waiting for every architecture to finish.
      - name: Publish ${{ matrix.arch }} DMG to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="TriCup $TAG (arm64 + x64 DMG, ad-hoc signed)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            # Create the release up front; tolerate a concurrent create from the
            # other architecture's job, which will then just upload its asset.
            gh release create "$TAG" --title "TriCup $TAG" --notes "$NOTES" \
              --verify-tag --repo "$GITHUB_REPOSITORY" || true
          fi
          gh release upload "$TAG" "tmp/build/TriCup-${{ matrix.arch }}.dmg" \
            --clobber --repo "$GITHUB_REPOSITORY"
